# Namespace guardrails: ResourceQuota caps aggregate requests so a single
# team cannot silently absorb cluster capacity; LimitRange sets defaults so
# pods without resources get sane values instead of BestEffort QoS.
# Values are examples for a dev cluster; prod quotas are derived from
# rightsizing reports plus 30% headroom.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute-quota
  namespace: payments
  labels:
    app.kubernetes.io/part-of: payments
    app.kubernetes.io/managed-by: kustomize
    finops.example.com/env: dev
spec:
  hard:
    requests.cpu: "16"
    requests.memory: 48Gi
    limits.memory: 64Gi
    pods: "120"
    persistentvolumeclaims: "20"
    requests.storage: 500Gi
    count/loadbalancers.networking.gke.io: "0"
    services.loadbalancers: "1"
  scopeSelector:
    matchExpressions:
      - operator: NotIn
        scopeName: PriorityClass
        values: ["system-cluster-critical", "system-node-critical"]
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: spot-only-batch
  namespace: data
  labels:
    app.kubernetes.io/part-of: data
    app.kubernetes.io/managed-by: kustomize
spec:
  hard:
    requests.cpu: "64"
    requests.memory: 256Gi
    pods: "200"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: payments
  labels:
    app.kubernetes.io/part-of: payments
    app.kubernetes.io/managed-by: kustomize
spec:
  limits:
    - type: Container
      default:
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 256Mi
      max:
        cpu: "8"
        memory: 16Gi
      min:
        cpu: 10m
        memory: 32Mi
      maxLimitRequestRatio:
        memory: "1"
    - type: PersistentVolumeClaim
      max:
        storage: 200Gi
      min:
        storage: 1Gi
